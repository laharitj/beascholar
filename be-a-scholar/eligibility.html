<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Review scholarship opportunities matched to your saved profile." />
  <title>Scholarship matches | Be A Scholar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" /><link rel="stylesheet" href="css/profile.css" /><link rel="stylesheet" href="css/eligibility.css" />
</head>
<body class="profile-page eligibility-page">
  <header class="profile-header"><div class="container profile-nav"><a class="brand" href="index.html"><span class="brand-mark">B</span><span>Be A Scholar</span></a><div class="profile-nav-actions"><a class="button button-ghost button-small" href="profile.html">Edit profile</a><button class="button button-ghost button-small" type="button" data-logout>Log out</button></div></div></header>
  <main class="eligibility-main container">
    <section class="results-hero"><div><p class="eyebrow">Scholarship matches</p><h1>Find the right<br /><em>next step.</em></h1><p>These results use your latest saved profile and the scholarship information published in the shared source sheet.</p></div><div class="results-count"><strong data-results-count>—</strong><span>source records<br />reviewed</span></div></section>
    <section class="results-toolbar" aria-label="Scholarship filters"><div class="filter-wrap"><label for="state-filter">State</label><select id="state-filter" data-state-filter><option value="">All states</option></select></div></section>
    <nav class="status-tabs" aria-label="Eligibility status filters"><button class="status-tab is-active" type="button" data-status-filter="ALL">All <span data-tab-count="ALL"></span></button><button class="status-tab" type="button" data-status-filter="ELIGIBLE">Eligible <span data-tab-count="ELIGIBLE"></span></button><button class="status-tab" type="button" data-status-filter="NEEDS_VERIFICATION">Needs verification <span data-tab-count="NEEDS_VERIFICATION"></span></button><button class="status-tab" type="button" data-status-filter="NOT_ELIGIBLE">Not eligible <span data-tab-count="NOT_ELIGIBLE"></span></button></nav>
    <div class="results-message" data-results-message role="status">Loading scholarship information...</div><section class="scholarship-grid" data-scholarship-grid></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/auth.js?v=20260919"></script><script src="js/scholarship-service.js?v=20260919"></script><script src="js/eligibility-engine.js?v=20260919"></script><script src="js/eligibility.js?v=20260919"></script>
</body>
</html>
