<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Log in to your Be A Scholar account." /><title>Log in | Be A Scholar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" /><link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page"><main class="auth-layout"><a class="auth-brand brand" href="index.html"><span class="brand-mark">B</span><span>Be A Scholar</span></a><section class="auth-card" aria-labelledby="login-title"><div class="auth-card-heading"><p class="eyebrow">Welcome back</p><h1 id="login-title">Continue your<br /><em>journey.</em></h1><p>Log in to keep your next opportunity in sight.</p></div><form id="login-form" novalidate><div class="form-field"><label for="login-email">Email ID</label><input id="login-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required /><small class="field-error" data-error-for="login-email"></small></div><div class="form-field"><div class="field-label-row"><label for="login-password">Password</label><a href="#" class="quiet-link" data-demo-action>Forgot password?</a></div><input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required /><small class="field-error" data-error-for="login-password"></small></div><p class="form-message" data-form-message role="status"></p><button class="button button-primary button-full" type="submit">Log in <span aria-hidden="true">↗</span></button></form><p class="auth-switch">New to Be A Scholar? <a href="signup.html">Create an account</a></p></section><p class="auth-footer">Your next chapter starts with one step.</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/validation.js"></script><script src="js/auth.js"></script></body>
</html>
