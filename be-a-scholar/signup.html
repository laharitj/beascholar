<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Create your Be A Scholar account." /><title>Create account | Be A Scholar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" /><link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page"><main class="auth-layout auth-layout-signup"><a class="auth-brand brand" href="index.html"><span class="brand-mark">B</span><span>Be A Scholar</span></a><section class="auth-card auth-card-wide" aria-labelledby="signup-title"><div class="auth-card-heading"><p class="eyebrow">Your future, organized</p><h1 id="signup-title">Make room for<br /><em>possibility.</em></h1><p>Create a secure account to begin your scholarship journey.</p></div><form id="signup-form" novalidate><div class="form-grid"><div class="form-field"><label for="full-name">Full Name</label><input id="full-name" name="fullName" type="text" autocomplete="name" placeholder="Your full name" required /><small class="field-error" data-error-for="full-name"></small></div><div class="form-field"><label for="signup-email">Email ID</label><input id="signup-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required /><small class="field-error" data-error-for="signup-email"></small></div><div class="form-field"><label for="phone">Phone Number</label><input id="phone" name="phone" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel" placeholder="10-digit phone number" required /><small class="field-error" data-error-for="phone"></small></div><div class="form-field"><label for="user-id">User ID</label><input id="user-id" name="userId" type="text" autocomplete="username" placeholder="Choose a user ID" required /><small class="field-error" data-error-for="user-id"></small></div></div><div class="form-field"><label for="signup-password">Password</label><input id="signup-password" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" required /><small class="field-hint">Use one uppercase letter, one number, and one special character.</small><small class="field-error" data-error-for="signup-password"></small></div><p class="form-message" data-form-message role="status"></p><button class="button button-primary button-full" type="submit">Create account <span aria-hidden="true">↗</span></button></form><p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p></section><p class="auth-footer">Your next chapter starts with one step.</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/validation.js"></script><script src="js/auth.js"></script></body>
</html>
